name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - run: go vet ./... && go test ./...
        working-directory: helpers/go-testast

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get && dart analyze && dart format --output=none --set-exit-if-changed . && dart test
        working-directory: helpers/dart_testast

      - name: Install gremlins
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - name: Install the Stryker fixture
        run: npm ci
        working-directory: test/fixtures/stryker
      - run: npm run build
      - run: npm test
