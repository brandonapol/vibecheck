name: Vibecheck Test Integrity

on:
  workflow_call:
    inputs:
      protected-branch:
        description: 'Branch to compare against for semantic diff'
        required: false
        type: string
        default: 'main'
      threshold:
        description: 'Minimum composite integrity score (0-100); mutation.threshold in vibecheck.config.ts gates the mutation score'
        required: false
        type: number
        default: 80
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '20'
    secrets:
      hidden-tests-deploy-key:
        description: 'SSH deploy key for hidden tests repo (optional)'
        required: false

jobs:
  vibecheck:
    name: Test Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Load hidden-tests deploy key
        env:
          HIDDEN_KEY: ${{ secrets.hidden-tests-deploy-key }}
        run: |
          if [ -n "$HIDDEN_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/vibecheck-hidden-key"
            printf '%s\n' "$HIDDEN_KEY" > "$RUNNER_TEMP/vibecheck-hidden-key"
            echo "VIBECHECK_HIDDEN_TESTS_KEY=$RUNNER_TEMP/vibecheck-hidden-key" >> "$GITHUB_ENV"
          fi

      - name: Run vibecheck
        # The config is read from the base branch, never from the PR under review.
        run: npx vibecheck check --threshold ${{ inputs.threshold }} --base origin/${{ github.base_ref || inputs.protected-branch }}
